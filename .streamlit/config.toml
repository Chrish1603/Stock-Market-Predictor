# Dashboard theme. Colours come from the validated chart palette: blue accent (red is reserved
# for "down" / "stressed"), warm off-white surfaces, hairline borders. Light and dark are each
# set explicitly rather than auto-inverted.

[theme]
primaryColor = "#2a78d6"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
headingFontWeights = [650, 600, 600, 600, 600, 600]
headingFontSizes = ["2.1rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
metricValueFontWeight = 600
baseRadius = "0.65rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
redColor = "#d03b3b"
greenColor = "#0ca30c"
blueColor = "#2a78d6"

[theme.light]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#1a1a19"
borderColor = "#e4e3dc"
dataframeHeaderBackgroundColor = "#f3f2ee"

[theme.light.sidebar]
backgroundColor = "#f6f5f1"

# Dark uses cool blue-grey neutrals rather than warm ones, so the blue accent and charts sit in the
# same colour family (warm near-black under blue read as muddy).
[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0f1216"
secondaryBackgroundColor = "#181c22"
textColor = "#eceef1"
borderColor = "#262b33"
dataframeHeaderBackgroundColor = "#181c22"

[theme.dark.sidebar]
backgroundColor = "#12151a"

[client]
toolbarMode = "minimal"   # hide the Deploy button
