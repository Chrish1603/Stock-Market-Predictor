# Stock Market Predictor configuration

data:
  tickers: [AAPL, MSFT, NVDA, SPY]   # stocks to model
  market_tickers: [SPY, ^VIX]        # market context: S&P 500 and volatility
  # Optional inputs. Tested Nov 2026 (mean walk-forward CV ROC-AUC over 12 models):
  #   earnings only 0.5181 | none 0.5172 | earnings + rates + sectors 0.5137
  # Rates and sector funds added noise, so they're off. To try them again:
  #   market_tickers: [SPY, ^VIX, ^TNX, ^IRX]   (10-year and 3-month Treasury yields)
  #   sectors: {AAPL: XLK, MSFT: XLK, NVDA: SMH}
  sectors: {}                        # sector fund per stock (relative-strength features)
  earnings: true                     # earnings-date features for stocks (skipped for ETFs)
  # Extra stocks used only as training data for the pooled model (train.scope: pooled).
  # Large US companies with history back to 2010, across sectors. Note: picking today's large
  # companies favours past winners (survivorship bias), which can flatter long-run backtests.
  universe: [
    GOOGL, AMZN, ORCL, CSCO, INTC, ADBE, CRM, QCOM, TXN, AMD, IBM, AVGO,   # tech
    JPM, BAC, WFC, GS, MS, C, AXP, BLK,                                    # financials
    JNJ, PFE, MRK, UNH, ABT, LLY, AMGN, BMY, TMO, MDT,                     # health care
    PG, KO, PEP, WMT, HD, MCD, NKE, COST, SBUX, DIS, LOW, TGT,             # consumer
    CAT, BA, HON, GE, MMM, UPS, UNP, LMT, DE,                              # industrials
    XOM, CVX, COP, SLB,                                                    # energy
    NEE, DUK, T, VZ,                                                       # utilities, telecom
  ]
  cross_sectional: true              # rank momentum/volatility across all tickers each day
  start: "2010-01-01"
  end: null                          # null = up to today
  ffill_limit: 2                     # max consecutive missing values to forward-fill
  outlier_z: 6.0                     # flag daily returns beyond this z-score

train:
  horizons: [1, 5, 20]               # predict 1, 5 and 20 trading days ahead (one model set each)
  # per_ticker: one model per stock. pooled: one shared model trained on tickers + universe.
  # Tested Nov 2026 on the 4 tickers (mean CV / hold-out ROC-AUC): per_ticker 0.5181 / 0.5251,
  # pooled 0.5051 / 0.5548. Pooled was worse across CV years, so per_ticker is the default.
  scope: per_ticker
  n_splits: 5                        # walk-forward folds on the development set
  holdout_days: 252                  # final ~12 months kept for out-of-sample evaluation
  gap: 1                             # rows skipped between train and test in each fold
  tune: false                        # Optuna tuning of LightGBM (needs `pip install -e .[tune]`)
  n_trials: 20
  random_state: 42

risk:                                # volatility / drawdown forecasts and position sizing
  enabled: true
  horizons: [5, 20]                  # forecast risk 5 and 20 trading days ahead
  drop_threshold: 0.05               # "big drop" = close falls 5% below today's within the horizon
  target_vol: 0.15                   # allocation aims for 15% annualised volatility
  max_weight: 1.0                    # no leverage
  rebalance_band: 0.10               # only trade when the target weight moves by more than 10 points
  allocation_horizon: 20             # risk horizon used for position sizing
  # Size with last month's volatility (trailing) or the model's forecast (model). Backtest 2013-2026:
  # both cut max drawdown by about a third; trailing had equal or better Sharpe, so it's the default.
  sizing_vol: trailing
  market_ticker: SPY                 # market regime is based on this ticker

backtest:
  cost: 0.001                        # 0.1% cost per position change
  prob_threshold: 0.5                # classifier: go long when P(up) > threshold

paths:                               # relative to the project root
  raw: data/raw
  clean: data/processed/clean
  features: data/processed/features
  models: models
  logs: logs
  history: data/history              # every prediction ever made, scored once the outcome is known

dashboard:
  # A hosted dashboard with no local pipeline output downloads this snapshot (built daily by
  # GitHub Actions with `smp publish`). Local runs use local data and ignore this.
  data_url: https://github.com/Chrish1603/Stock-Market-Predictor/archive/refs/heads/dashboard-data.tar.gz
  # The daily GitHub run keeps the official track record. Local runs merge it in before predicting
  # (its rows win for days both recorded; nothing local is ever dropped). Skipped on GitHub Actions.
  sync_track_record: true

notify:
  macos: true                        # desktop notification after each local run (skipped off macOS)
  ntfy_topic: null                   # set to a private topic name to get phone pushes via ntfy.sh
