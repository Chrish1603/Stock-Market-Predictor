# Stock Market Predictor configuration

data:
  tickers: [AAPL, MSFT, NVDA, SPY]   # stocks to model
  market_tickers: [SPY, ^VIX]        # market context: S&P 500 and volatility
  # Optional inputs. Tested Nov 2026 (mean walk-forward CV ROC-AUC over 12 models):
  #   earnings only 0.5181 | none 0.5172 | earnings + rates + sectors 0.5137
  # Rates and sector funds added noise, so they're off. To try them again:
  #   market_tickers: [SPY, ^VIX, ^TNX, ^IRX]   (10-year and 3-month Treasury yields)
  #   sectors: {AAPL: XLK, MSFT: XLK, NVDA: SMH}
  sectors: {}                        # sector fund per stock (relative-strength features)
  earnings: true                     # earnings-date features for stocks (skipped for ETFs)
  start: "2010-01-01"
  end: null                          # null = up to today
  ffill_limit: 2                     # max consecutive missing values to forward-fill
  outlier_z: 6.0                     # flag daily returns beyond this z-score

train:
  horizons: [1, 5, 20]               # predict 1, 5 and 20 trading days ahead (one model set each)
  n_splits: 5                        # walk-forward folds on the development set
  holdout_days: 252                  # final ~12 months kept for out-of-sample evaluation
  gap: 1                             # rows skipped between train and test in each fold
  tune: false                        # Optuna tuning of LightGBM (needs `pip install -e .[tune]`)
  n_trials: 20
  random_state: 42

backtest:
  cost: 0.001                        # 0.1% cost per position change
  prob_threshold: 0.5                # classifier: go long when P(up) > threshold

paths:                               # relative to the project root
  raw: data/raw
  clean: data/processed/clean
  features: data/processed/features
  models: models
  logs: logs
  history: data/history              # every prediction ever made, scored once the outcome is known
