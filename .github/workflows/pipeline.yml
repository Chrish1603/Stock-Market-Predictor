name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # GitHub's scheduler is best effort and can drop runs, so there are three slots after each US close.
    # Later slots exit early once that day's snapshot is published.
    - cron: "30 22 * * 1-5"   # 22:30 UTC Mon-Fri
    - cron: "30 1 * * 2-6"    # 01:30 UTC, backup
    - cron: "30 4 * * 2-6"    # 04:30 UTC, backup
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || 'daily' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  daily:
    # Runs the pipeline and publishes the dashboard snapshot to the dashboard-data branch.
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e .

      - name: Skip if today's snapshot is already published
        id: check
        run: |
          if git fetch --depth 1 origin dashboard-data 2>/dev/null \
             && git show FETCH_HEAD:manifest.json > /tmp/manifest.json 2>/dev/null \
             && smp health --snapshot /tmp/manifest.json \
             && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot is already current; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore track record from the last snapshot
        if: steps.check.outputs.skip != 'true'
        run: |
          if git fetch --depth 1 origin dashboard-data 2>/dev/null; then
            mkdir -p data
            git archive FETCH_HEAD data/history | tar -x -C . || true
            ls -la data/history || true
          else
            echo "No snapshot yet; starting a fresh track record."
          fi

      - name: Run pipeline
        if: steps.check.outputs.skip != 'true'
        env:
          SMP_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: phone push via ntfy.sh
        run: smp run-all

      - name: Publish dashboard snapshot
        # also after a partly failed run: publish whatever succeeded and keep the track record moving
        if: steps.check.outputs.skip != 'true' && !cancelled()
        run: |
          [ -f models/risk_predictions.parquet ] || { echo "No forecasts to publish"; exit 1; }
          smp publish --out site-data
          cd site-data
          git init -q -b dashboard-data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Dashboard snapshot $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              dashboard-data

      - name: Fail the run if data is still stale (GitHub then emails the repo owner)
        if: steps.check.outputs.skip != 'true' && !cancelled()
        run: smp health

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
          retention-days: 14
