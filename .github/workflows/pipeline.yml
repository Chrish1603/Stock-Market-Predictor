name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC on weekdays, after the US close
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  run-pipeline:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: smp run-all
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            models/
            data/processed/clean/quality_report.json
            logs/
          retention-days: 14
