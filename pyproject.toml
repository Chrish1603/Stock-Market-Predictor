[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smp"
version = "0.1.0"
description = "Stock market predictor: automated data pipeline, ML models and Streamlit dashboard"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "yfinance>=0.2.40",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
tune = ["optuna>=3.4"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
smp = "smp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["smp", "conftest"]
